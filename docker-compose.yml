services:
  db:
    image: postgres:15
    container_name: nest_postgres
    restart: always
    ports:
      - "5433:5432"  # 5432 এর জায়গায় 5433 use করুন
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: nest_backend
    restart: always
    ports:
      - "4001:4000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DATABASE_URL same থাকবে কারণ এটা internal network
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mydb
      - JWT_SECRET=your-secret-key-here-change-this
      - PORT=4000
      - NODE_ENV=production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: